name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── Linux (.deb, .rpm) ───────────────────────────────────────────────
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            dockerfile: test/Dockerfile.ubuntu
          - distro: debian
            dockerfile: test/Dockerfile.debian
          - distro: fedora
            dockerfile: test/Dockerfile.fedora
          - distro: arch
            dockerfile: test/Dockerfile.arch
    steps:
      - uses: actions/checkout@v4

      - name: Build & test (${{ matrix.distro }})
        run: docker build -f ${{ matrix.dockerfile }} -t cmdx-${{ matrix.distro }} .

      - name: Extract packages
        if: matrix.distro == 'ubuntu'
        run: |
          docker create --name extract cmdx-ubuntu
          docker cp extract:/src/build/cmdx_1.0.0_amd64.deb .
          docker rm extract

      - name: Extract RPM
        if: matrix.distro == 'fedora'
        run: |
          docker create --name extract cmdx-fedora
          docker cp extract:/src/build/ ./fedora-build
          docker rm extract
          cp fedora-build/cmdx-*.rpm . 2>/dev/null || true

      - name: Upload .deb
        if: matrix.distro == 'ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: cmdx-linux-deb
          path: "*.deb"

      - name: Upload .rpm
        if: matrix.distro == 'fedora'
        uses: actions/upload-artifact@v4
        with:
          name: cmdx-linux-rpm
          path: "*.rpm"

  # ── macOS (.pkg) ─────────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt@6 nlohmann-json cmake

      - name: Install Apple signing certificates
        if: ${{ secrets.APPLE_DEV_ID_APP_CERT_BASE64 != '' && secrets.APPLE_DEV_ID_INSTALLER_CERT_BASE64 != '' && secrets.APPLE_DEV_ID_APP_CERT_PASSWORD != '' && secrets.APPLE_DEV_ID_INSTALLER_CERT_PASSWORD != '' && secrets.APPLE_KEYCHAIN_PASSWORD != '' }}
        env:
          APPLE_DEV_ID_APP_CERT_BASE64: ${{ secrets.APPLE_DEV_ID_APP_CERT_BASE64 }}
          APPLE_DEV_ID_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_DEV_ID_INSTALLER_CERT_BASE64 }}
          APPLE_DEV_ID_APP_CERT_PASSWORD: ${{ secrets.APPLE_DEV_ID_APP_CERT_PASSWORD }}
          APPLE_DEV_ID_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_DEV_ID_INSTALLER_CERT_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          APP_CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/developer-id-installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/cmdx-signing.keychain-db"

          echo -n "$APPLE_DEV_ID_APP_CERT_BASE64" | base64 -D -o "$APP_CERT_PATH"
          echo -n "$APPLE_DEV_ID_INSTALLER_CERT_BASE64" | base64 -D -o "$INSTALLER_CERT_PATH"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -P "$APPLE_DEV_ID_APP_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$APPLE_DEV_ID_INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "CMDX_MAC_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build
        env:
          CMDX_MAC_CODESIGN_IDENTITY: ${{ secrets.APPLE_DEV_ID_APP_IDENTITY }}
          CMDX_MAC_INSTALLER_IDENTITY: ${{ secrets.APPLE_DEV_ID_INSTALLER_IDENTITY }}
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          cmake_args=(
            -B build
            -DCMAKE_INSTALL_PREFIX=/usr/local
            -DCMAKE_BUILD_TYPE=Release
          )

          if [ -n "$CMDX_MAC_CODESIGN_IDENTITY" ] && [ -n "$CMDX_MAC_INSTALLER_IDENTITY" ] && [ -n "$CMDX_MAC_KEYCHAIN_PATH" ]; then
            cmake_args+=(
              "-DCMDX_MAC_CODESIGN_IDENTITY=$CMDX_MAC_CODESIGN_IDENTITY"
              "-DCMDX_MAC_INSTALLER_IDENTITY=$CMDX_MAC_INSTALLER_IDENTITY"
              "-DCMDX_MAC_KEYCHAIN_PATH=$CMDX_MAC_KEYCHAIN_PATH"
            )
          fi

          cmake "${cmake_args[@]}"
          cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Verify
        run: |
          ./build/cmdx --version
          ./build/cmdx -h
          ./build/cmdx list | wc -l

      - name: Package .pkg
        run: cd build && cpack -G productbuild

      - name: Notarize and staple .pkg
        if: ${{ secrets.APPLE_NOTARY_APPLE_ID != '' && secrets.APPLE_NOTARY_TEAM_ID != '' && secrets.APPLE_NOTARY_PASSWORD != '' && secrets.APPLE_DEV_ID_APP_IDENTITY != '' && secrets.APPLE_DEV_ID_INSTALLER_IDENTITY != '' }}
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          PKG_PATH="$(find build -maxdepth 1 -name 'Cmdx-Installer-*.pkg' | head -n 1)"
          if [ -z "$PKG_PATH" ]; then
            echo "No macOS package found to notarize."
            exit 1
          fi
          xcrun notarytool submit "$PKG_PATH" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$PKG_PATH"

      - name: Upload .pkg
        uses: actions/upload-artifact@v4
        with:
          name: cmdx-macos-pkg
          path: build/*.pkg

  # ── Windows (.exe installer) ─────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'

      - name: Install nlohmann-json via vcpkg
        run: vcpkg install nlohmann-json:x64-windows

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Configure
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="C:/Program Files/cmdx"

      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Verify
        run: |
          .\build\Release\cmdx.exe --version
          .\build\Release\cmdx.exe -h
          .\build\Release\cmdx.exe --list | Select-Object -First 5

      - name: Stage install tree
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "cmdx-stage"
          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          cmake --install build --config Release --prefix $stage

          Get-ChildItem -Path $stage -Recurse |
            Select-Object FullName

          $required = @(
            (Join-Path $stage "bin\cmdx.exe"),
            (Join-Path $stage "bin\qt.conf"),
            (Join-Path $stage "bin\Qt6Core.dll"),
            (Join-Path $stage "bin\Qt6Gui.dll"),
            (Join-Path $stage "bin\Qt6Widgets.dll"),
            (Join-Path $stage "bin\MSVCP140.dll"),
            (Join-Path $stage "bin\VCRUNTIME140.dll"),
            (Join-Path $stage "bin\VCRUNTIME140_1.dll"),
            (Join-Path $stage "plugins\platforms\qwindows.dll"),
            (Join-Path $stage "share\cmdx\commands")
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing staged artifact: $path"
            }
          }

      - name: Package installer
        run: cd build && cpack -G NSIS -C Release

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cmdx-windows-installer
          path: build/Cmdx-Setup-*.exe

  # ── Release (auto-publish on tag push) ───────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Remove stale release assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              for (const asset of release.data.assets) {
                if (
                  asset.name === 'cmdx.exe' ||
                  asset.name.endsWith('.dmg') ||
                  asset.name.endsWith('.zip') ||
                  asset.name.endsWith('.tar.gz')
                ) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id,
                  });
                }
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cmdx-linux-deb/*
            artifacts/cmdx-linux-rpm/*
            artifacts/cmdx-macos-pkg/*
            artifacts/cmdx-windows-installer/*
          generate_release_notes: true
